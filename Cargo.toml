[package]
name = "streamvault"
version = "1.0.31"
edition = "2024"

[dependencies]
dirs = "7"
regex = "1"
scraper = "0.27"
serde_json = "1"
async-trait = "0.1"
percent-encoding = "2"
unicode-normalization = "0.1.26"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = { version = "0.7", features = ["fullscreen"] }
reqwest = { version = "0.13", features = ["json", "cookies", "query", "form"] }
