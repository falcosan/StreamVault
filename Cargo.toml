[package]
name = "streamvault"
version = "1.0.34"
edition = "2024"

[dependencies]
dirs = "7"
regex = "1"
scraper = "0.27"
serde_json = "1"
async-trait = "0.1"
percent-encoding = "2"
unicode-normalization = "0.1.26"
tokio = { version = "1", features = [
  "rt",
  "fs",
  "net",
  "time",
  "sync",
  "macros",
  "process",
  "io-util",
] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = { version = "0.7", features = ["fullscreen"] }
reqwest = { version = "0.13", features = ["json", "cookies", "query", "form"] }
