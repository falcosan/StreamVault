[package]
name = "streamvault"
version = "1.2.4"
edition = "2024"
build = "src/build.rs"

[features]
default = ["desktop"]
app = [
  "dep:async-trait",
  "dep:base64",
  "dep:dioxus",
  "dep:futures",
  "dep:regex",
  "dep:reqwest",
  "dep:scraper",
  "dep:sys-locale",
  "dep:unicode-normalization",
  "dep:uuid",
  "dep:web-time",
  "reqwest/json",
  "reqwest/query",
  "reqwest/form",
  "tokio/sync",
]
desktop = [
  "app",
  "dioxus/desktop",
  "dep:dioxus-desktop",
  "dep:dirs",
  "dep:embed-resource",
  "dep:image",
  "dep:windows-sys",
  "reqwest/default-tls",
  "uuid/serde",
  "tokio/rt",
  "tokio/fs",
  "tokio/process",
  "tokio/io-util",
]
tv = [
  "app",
  "dioxus/web",
  "dep:console_error_panic_hook",
  "sys-locale/js",
  "uuid/js",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
]
deploy = [
  "dep:base64",
  "dep:dirs",
  "dep:futures",
  "dep:if-addrs",
  "dep:p12-keystore",
  "dep:reqwest",
  "dep:rsa",
  "dep:uuid",
  "dep:x509-cert",
  "dep:zip",
  "reqwest/native-tls",
  "reqwest/multipart",
  "tokio/rt",
  "tokio/signal",
  "tokio/net",
  "tokio/fs",
  "tokio/process",
  "tokio/io-util",
]

[dependencies]
dirs = { version = "7", optional = true }
if-addrs = { version = "0.15", optional = true }
base64 = { version = "0.23", optional = true }
p12-keystore = { version = "0.4", optional = true }
rsa = { version = "0.9", features = ["getrandom", "sha2"], optional = true }
x509-cert = { version = "0.2", features = ["builder"], optional = true }
zip = { version = "9", default-features = false, features = [
  "deflate-flate2-zlib-rs",
], optional = true }
regex = { version = "1", optional = true }
scraper = { version = "0.29", default-features = false, optional = true }
sys-locale = { version = "0.3", optional = true }
serde_json = "1"
async-trait = { version = "0.1", optional = true }
percent-encoding = "2"
unicode-normalization = { version = "0.1.26", optional = true }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"], optional = true }
dioxus = { version = "0.7", optional = true }
dioxus-desktop = { version = "0.7", features = ["fullscreen"], optional = true }
reqwest = { version = "0.13", default-features = false, features = [
  "http2",
  "system-proxy",
], optional = true }
futures = { version = "0.3", default-features = false, features = [
  "std",
], optional = true }
web-time = { version = "1", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Document",
  "DomRect",
  "Element",
  "FocusOptions",
  "HtmlElement",
  "KeyboardEvent",
  "MutationObserver",
  "MutationObserverInit",
  "NodeList",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "ScrollToOptions",
  "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["macros"] }
gloo-timers = { version = "0.4", features = ["futures"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
], optional = true }

[build-dependencies]
embed-resource = { version = "3", optional = true }
image = { version = "0.25", default-features = false, features = [
  "ico",
  "png",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "test-util"] }
